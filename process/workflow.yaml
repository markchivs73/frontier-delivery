# The delivery state machine as data.
#
# process/workflow.md explains it; this file is what the runner executes and what
# the Frontier Workflow DAG is generated from. tests/test_repo_consistency.py keeps
# this file, process/handoffs.md, roles/, the Claude/Copilot wrappers and the
# pinned contracts (contracts/contracts.lock.json) in sync.
#
# `contract: <id>@<major>` names the envelope contract on each stage's output
# edge. Pins (hash) live in the lock; a definition carries them at publish.
#
# Budgets live in the policy (policy/policy.yaml → budgets), not here.

version: 1

stages:
  shape:
    agent: shaper
    contract: frontier.delivery.shaper-envelope@1
    artifacts: [options.md, decision-log.md, backlog.md, backlog.yaml]
    on:
      needs_input: gate-backlog        # phase: options. The human picks an option.
      ok: gate-backlog                 # phase: backlog. The human approves the backlog.
      failed: escalate
  intake:
    agent: requirements-analyst
    contract: frontier.delivery.requirements-analyst-envelope@1
    artifacts: [requirements.md]
    on: { ok: plan, needs_input: escalate, failed: escalate }
  plan:
    agent: planner
    contract: frontier.delivery.planner-envelope@1
    artifacts: [design.md, tasks.md]
    on: { ok: gate-plan, needs_input: escalate, failed: escalate }
  implement:
    agent: implementer
    contract: frontier.delivery.implementer-envelope@1
    on: { ok: verify, needs_input: escalate, failed: escalate }
  verify:
    parallel: [check-requirements, check-architecture, check-security, check-test-adequacy]
    contract: frontier.delivery.check-envelope@1
    artifacts: [verification-report.md]
    on:
      pass: deliver
      fail: implement                  # bounded by budgets.verify_fix
      budget_exhausted: escalate
  deliver:
    on: { ok: gate-merge }
  learn:
    agent: retro
    contract: frontier.delivery.retro-envelope@1
    on: { ok: done, failed: done }

gates:
  backlog:
    after: shape
    on: { approve: publish-backlog, changes: shape, reject: done }
  plan:
    after: plan
    on: { approve: implement, changes: plan, reject: done }
  merge:
    after: deliver
    on: { approve: merged, changes: implement, reject: done }

terminal: [done, merged, escalate]
