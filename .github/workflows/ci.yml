name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet -r runner/requirements.txt pytest
      - name: Contracts pinned and rules compile
        run: PYTHONPATH=runner python -m frontier --repo . contracts verify
      - name: Tests (guard, gates, runner loop, contract conformance, repo consistency)
        run: python -m pytest -q tests
      - name: Shell scripts
        run: bash -n init/frontier-init.sh
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global --silent @anthropic-ai/claude-code
      - name: Validate the plugin and marketplace
        run: claude plugin validate .
